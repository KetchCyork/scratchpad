<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratchpad - Network Clipboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .input-section {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .input-section h2 {
      margin-bottom: 15px;
      color: #333;
      font-size: 1.3em;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-danger {
      background: #ff6b6b;
      color: white;
    }

    .btn-danger:hover {
      background: #ee5a52;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    .items-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .item-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
    }

    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .item-type {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }

    .item-type.image {
      background: #764ba2;
    }

    .item-time {
      font-size: 0.85em;
      color: #999;
    }

    .item-content {
      flex: 1;
      margin-bottom: 12px;
      overflow-y: auto;
      max-height: 150px;
    }

    .item-content pre {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #333;
    }

    .item-content img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 6px;
      margin-top: 8px;
    }

    .item-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.9em;
    }

    .btn-copy {
      background: #667eea;
      color: white;
    }

    .btn-copy:hover {
      background: #5568d3;
    }

    .btn-delete {
      background: #ff6b6b;
      color: white;
    }

    .btn-delete:hover {
      background: #ee5a52;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: white;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    .hostname {
      font-size: 0.85em;
      color: #666;
      margin-top: 8px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.3s ease-out;
      z-index: 1000;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8em;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .items-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Scratchpad</h1>
      <p>Share text and screenshots across your network</p>
    </header>

    <div class="input-section">
      <h2>Add to Clipboard</h2>
      <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>
      <div class="button-group">
        <button class="btn-primary" onclick="addText()">Add Text</button>
        <div class="file-input-wrapper">
          <button class="btn-primary">Upload Image</button>
          <input type="file" id="imageInput" accept="image/*" onchange="addImage()">
        </div>
        <button class="btn-secondary" onclick="copyLastItem()">Copy Last Item</button>
        <button class="btn-danger" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <div id="itemsContainer" class="items-section">
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <h2>No items yet</h2>
        <p>Start by adding text or uploading an image</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin + '/api';

    async function loadItems() {
      try {
        const response = await fetch(`${API_URL}/items`);
        const items = await response.json();
        renderItems(items);
      } catch (error) {
        console.error('Error loading items:', error);
      }
    }

    function renderItems(items) {
      const container = document.getElementById('itemsContainer');

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h2>No items yet</h2>
            <p>Start by adding text or uploading an image</p>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-header">
            <span class="item-type ${item.type}">${item.type === 'image' ? '🖼️ Image' : '📝 Text'}</span>
            <span class="item-time">${new Date(item.createdAt).toLocaleTimeString()}</span>
          </div>
          <div class="item-content">
            ${item.type === 'image'
              ? `<img src="${item.content}" alt="Shared image">`
              : `<pre>${escapeHtml(item.content)}</pre>`
            }
          </div>
          <div class="hostname">From: ${item.hostname}</div>
          <div class="item-footer">
            <button class="btn-small btn-copy" onclick="copyItem('${item.id}', '${item.type}')">Copy</button>
            <button class="btn-small btn-delete" onclick="deleteItem('${item.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function addText() {
      const text = document.getElementById('textInput').value.trim();

      if (!text) {
        showToast('Please enter some text');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: text, type: 'text' })
        });

        if (response.ok) {
          document.getElementById('textInput').value = '';
          showToast('Text added!');
          loadItems();
        }
      } catch (error) {
        showToast('Error adding text');
        console.error(error);
      }
    }

    async function addImage() {
      const input = document.getElementById('imageInput');
      const file = input.files[0];

      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const response = await fetch(`${API_URL}/items`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: e.target.result, type: 'image' })
          });

          if (response.ok) {
            input.value = '';
            showToast('Image uploaded!');
            loadItems();
          }
        } catch (error) {
          showToast('Error uploading image');
          console.error(error);
        }
      };
      reader.readAsDataURL(file);
    }

    async function copyItem(itemId, type) {
      try {
        const response = await fetch(`${API_URL}/items/${itemId}`);
        const item = await response.json();

        if (type === 'text') {
          await navigator.clipboard.writeText(item.content);
        } else {
          // For images, we can't copy to clipboard directly in browser, but we can show a note
          showToast('Image copied to clipboard (if supported)');
          const img = new Image();
          img.src = item.content;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            canvas.toBlob(blob => {
              navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
              ]).catch(() => showToast('Image copied (browser limitation)'));
            });
          };
        }
        showToast(`${type === 'text' ? 'Text' : 'Image'} copied!`);
      } catch (error) {
        showToast('Error copying item');
        console.error(error);
      }
    }

    async function copyLastItem() {
      try {
        const response = await fetch(`${API_URL}/items`);
        const items = await response.json();
        if (items.length > 0) {
          await copyItem(items[0].id, items[0].type);
        } else {
          showToast('No items to copy');
        }
      } catch (error) {
        console.error(error);
      }
    }

    async function deleteItem(itemId) {
      try {
        await fetch(`${API_URL}/items/${itemId}`, { method: 'DELETE' });
        showToast('Item deleted');
        loadItems();
      } catch (error) {
        console.error(error);
      }
    }

    async function clearAll() {
      if (confirm('Are you sure you want to clear all items?')) {
        try {
          await fetch(`${API_URL}/clear`, { method: 'POST' });
          showToast('All items cleared');
          loadItems();
        } catch (error) {
          console.error(error);
        }
      }
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load items on page load
    loadItems();

    // Refresh items every 2 seconds
    setInterval(loadItems, 2000);

    // Allow Enter key to submit text
    document.getElementById('textInput').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        addText();
      }
    });
  </script>
</body>
</html>
